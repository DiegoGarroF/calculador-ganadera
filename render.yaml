services:
  - type: web
    name: calculadora-ganadera
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist/calculadora/browser
    branch: main
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
